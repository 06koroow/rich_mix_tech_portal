<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1015" />
  <title>Rich Mix — Tech Portal</title>

  <!-- Tailwind (Play CDN). No build step required to start.
       For production, swap this for the Tailwind CLI build — see README. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Single source of truth for theming lives in css/app.css (:root variables).
    // Tailwind colours below point at those variables, so re-skinning the whole
    // portal is a matter of editing the hex values in one place.
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg:        'var(--bg)',
            panel:     'var(--panel)',
            panel2:    'var(--panel-2)',
            line:      'var(--line)',
            ink:       'var(--ink)',
            muted:     'var(--muted)',
            accent:    'var(--accent)',
            'accent-ink': 'var(--accent-ink)',
            ok:        'var(--ok)',
            info:      'var(--info)',
            danger:    'var(--danger)',
          },
          fontFamily: {
            display: ['"Space Grotesk"', 'system-ui', 'sans-serif'],
            sans:    ['"IBM Plex Sans"', 'system-ui', 'sans-serif'],
            mono:    ['"IBM Plex Mono"', 'ui-monospace', 'monospace'],
          },
          borderRadius: { xl2: '1rem' },
        },
      },
    };
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/app.css" />
</head>
<body class="bg-bg text-ink font-sans antialiased">

  <!-- The whole UI is rendered into this root by js/app.js -->
  <div id="app"></div>

  <!-- Toast layer -->
  <div id="toast-layer" class="fixed z-50 bottom-6 left-1/2 -translate-x-1/2 flex flex-col items-center gap-2 pointer-events-none"></div>

  <!-- Modal layer -->
  <div id="modal-layer"></div>

  <!-- Print-only sheet target (QR labels render here) -->
  <div id="print-root"></div>

  <!-- ============================================================
       Load order matters (no bundler): foundations first, then
       data, then shared UI, then views (which register themselves),
       then the router, then the bootstrap.
       ============================================================ -->
  <script src="js/config.js?v=1789631192100"></script>
  <script src="data/seed.js"></script>
  <script src="js/store.js?v=1789631192100"></script>
  <script src="js/ui.js?v=1789631192100"></script>
  <script src="js/auth.js?v=1789631192100"></script>
  <script src="js/files.js?v=1789631192100"></script>

  <!-- SharePoint / Microsoft Graph backend (Disabled / commented out in favour of Supabase) -->
  <!--
  <script src="https://alcdn.msauth.net/browser/latest/js/msal-browser.min.js"></script>
  <script src="js/graph-config.js?v=1789631192100"></script>
  <script src="js/graph.js?v=1789631192100"></script>
  <script src="js/sync.js?v=1789631192100"></script>
  -->

  <!-- Supabase backend (opt-in). Inert until js/supabase-config.js has a url. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js?v=1789631192100"></script>
  <script src="js/supabase.js?v=1789631192100"></script>
  <script src="js/sync-supabase.js?v=1789631192100"></script>

  <!-- Vendored QR libraries (no build step; provide window.qrcode & window.Html5Qrcode) -->
  <script src="vendor/qrcode-generator.js"></script>
  <script src="vendor/html5-qrcode.min.js"></script>
  <script src="js/qr.js?v=1789631192100"></script>
  <script src="js/dmx.js?v=1789631192100"></script>

  <script src="js/views/dashboard.js?v=1789631192100"></script>
  <script src="js/views/procedures.js?v=1789631192100"></script>
  <script src="js/views/maintenance.js?v=1789631192100"></script>
  <script src="js/views/inventory.js?v=1789631192100"></script>
  <script src="js/views/users.js?v=1789631192100"></script>
  <script src="js/views/presets.js?v=1789631192100"></script>
  <script src="js/views/advancing.js?v=1789631192100"></script>
  <script src="js/views/venues.js?v=1789631192100"></script>
  <script src="js/router.js?v=1789631192100"></script>
  <script src="js/app.js?v=1789631192100"></script>
</body>
</html>
